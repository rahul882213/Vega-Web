services:
  - type: web
    name: vega-web-backend
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: ALLOWED_ORIGINS
        value: https://rahul882213.github.io
      - key: UPSTREAM_TIMEOUT_MS
        value: "30000"
      - key: MODFLIX_TTL_MS
        value: "3600000"
