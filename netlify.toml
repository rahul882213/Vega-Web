[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/api/edge-proxy"
  function = "edge-proxy"

[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/base-url"
  to = "/.netlify/functions/base-url"
  status = 200
  force = true

[[redirects]]
  from = "/api/crypto/digest"
  to = "/.netlify/functions/crypto-digest"
  status = 200
  force = true

[[redirects]]
  from = "/api/stream-proxy"
  to = "/.netlify/functions/stream-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
